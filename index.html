<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>💜Для тебя любимая💜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #1a1a1e;
      color: #f0e9f5;
      position: relative;
    }

    #welcomeScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1e;
      background-image: radial-gradient(circle at 30% 20%, #2b1e2b 0%, #0d0b0f 90%);
      transition: opacity 0.9s ease, transform 0.9s ease;
      will-change: transform, opacity;
    }

    #welcomeScreen.hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .welcome-content {
      text-align: center;
      padding: 30px;
      animation: float 3s ease-in-out infinite;
      max-width: 90%;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .welcome-heart {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 18px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .welcome-title {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      background: linear-gradient(135deg, #f0b6c5, #c1819e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .welcome-sub {
      font-size: clamp(0.9rem, 3vw, 1rem);
      color: #b9a3b5;
      margin-bottom: 32px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .welcome-btn {
      position: relative;
      padding: 16px 40px;
      border: none;
      border-radius: 60px;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      font-weight: 600;
      color: #fff;
      background: linear-gradient(145deg, #4c3545, #2e2130);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(75, 50, 70, 0.4);
      touch-action: manipulation;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .welcome-btn::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 62px;
      background: linear-gradient(135deg, #f0b6c5, #c1819e, #f0b6c5);
      background-size: 300% 300%;
      z-index: -1;
      animation: borderGlow 3s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .welcome-btn:active {
      transform: scale(0.92);
    }

    .welcome-btn .btn-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .welcome-btn .sparkle {
      display: inline-block;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.3) rotate(20deg); }
    }

    #mainContent {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 12px;
      opacity: 0;
      transition: opacity 0.8s ease;
      background: #1a1a1e;
      background-image: radial-gradient(circle at 30% 20%, #2b1e2b 0%, #0d0b0f 90%);
      position: relative;
      z-index: 1;
    }

    #mainContent.visible {
      opacity: 1;
    }

    .phone-frame {
      width: 100%;
      max-width: 420px;
      background: rgba(28, 22, 32, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 20px 16px 24px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255, 215, 175, 0.08) inset;
      border: 1px solid rgba(255, 200, 180, 0.1);
      margin: 10px auto;
      position: relative;
    }

    .share-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(42, 32, 44, 0.7);
      border: 1px solid rgba(230, 200, 215, 0.15);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 0.9rem;
      cursor: pointer;
      color: #d6c4cd;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .share-btn:active {
      transform: scale(0.9);
      background: rgba(72, 54, 70, 0.9);
    }

    .big-photo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #211a24;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(214, 175, 150, 0.25);
      border: 1px solid rgba(255, 220, 200, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 400px;
    }

    /* Применяем стили и к картинке, и к видео */
    .big-photo-frame img,
    .big-photo-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    @keyframes photoFadeIn {
      0% { opacity: 0; transform: scale(0.92) rotate(-1deg); filter: blur(6px); }
      60% { filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
    }

    @keyframes photoFadeOut {
      0% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
      100% { opacity: 0; transform: scale(1.08) rotate(1deg); filter: blur(6px); }
    }

    .big-photo-frame img.photo-fade-out,
    .big-photo-frame video.photo-fade-out {
      animation: photoFadeOut 0.15s ease forwards;
    }

    .big-photo-frame img.photo-fade-in,
    .big-photo-frame video.photo-fade-in {
      animation: photoFadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes photoGlow {
      0% { box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(214, 175, 150, 0.25); }
      50% { box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.7), 0 0 22px 4px rgba(240, 182, 197, 0.55), 0 0 0 2px rgba(240, 182, 197, 0.6); }
      100% { box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(214, 175, 150, 0.25); }
    }

    .big-photo-frame.photo-switching {
      animation: photoGlow 0.9s ease;
    }

    @keyframes heartBurst {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }

    .photo-caption {
      text-align: center;
      margin-top: -10px;
      margin-bottom: 8px;
      color: #cbb9c8;
      font-size: 0.8rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .days-together {
      text-align: center;
      font-size: 0.85rem;
      color: #f0b6c5;
      margin-bottom: 16px;
      letter-spacing: 0.8px;
      font-weight: 500;
      opacity: 0.9;
    }

    .days-together .number {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f0b6c5, #c1819e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .track-info {
      text-align: center;
      margin-bottom: 10px;
    }

    .track-title, .track-artist {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .track-info.updating .track-title {
      opacity: 0;
      transform: translateY(-6px);
    }

    .track-info.updating .track-artist {
      opacity: 0;
      transform: translateY(6px);
    }

    .track-title {
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 600;
      color: #f6e3ef;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: clamp(0.85rem, 3vw, 0.95rem);
      color: #b9a3b5;
      font-weight: 400;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #2a212e;
      border-radius: 20px;
      margin: 14px 0 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #c1819e, #f0b6c5);
      border-radius: 20px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #a58d9e;
      margin-top: -8px;
      margin-bottom: 10px;
    }

    .volume-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 8px 0;
    }

    .volume-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: #b9a3b5;
      transition: transform 0.2s ease;
      padding: 4px;
    }

    .volume-btn:active {
      transform: scale(0.8);
    }

    .volume-slider {
      width: 70px;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #2a212e;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f0b6c5, #c1819e);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      border: 2px solid #f6e3ef;
    }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(145deg, #f0b6c5, #c1819e);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      border: 2px solid #f6e3ef;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .ctrl-btn {
      background: rgba(42, 32, 44, 0.8);
      border: 1px solid rgba(230, 200, 215, 0.15);
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
      font-size: 1.5rem;
      color: #f0d9e6;
      user-select: none;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(72, 54, 70, 0.9);
    }

    .ctrl-btn.play-btn {
      width: 68px;
      height: 68px;
      background: linear-gradient(145deg, #4c3545, #2e2130);
      border: 1px solid rgba(255, 190, 200, 0.3);
      font-size: 2rem;
    }

    .track-counter {
      text-align: center;
      color: #a58d9e;
      font-size: 0.75rem;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .love-note {
      text-align: center;
      font-size: 0.75rem;
      color: #a58d9e;
      margin-top: 14px;
      letter-spacing: 0.5px;
    }

    .secret-btn {
      display: block;
      margin: 12px auto 0;
      background: none;
      border: 1px solid rgba(240, 182, 197, 0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .secret-btn:active {
      transform: scale(0.9);
      background: rgba(240, 182, 197, 0.15);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 8, 12, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: linear-gradient(145deg, #2b1e2b, #1a1218);
      border: 1px solid rgba(240, 182, 197, 0.25);
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-heart {
      font-size: 3rem;
      display: block;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    .modal-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #f0e9f5;
      margin-bottom: 24px;
    }

    .modal-close {
      padding: 12px 32px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(145deg, #4c3545, #2e2130);
      color: #f0d9e6;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-close:active {
      transform: scale(0.95);
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      background: #2f2633;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #d6c4cd;
      font-weight: 500;
      background-image: radial-gradient(circle at 50% 30%, #3a2f3d 0%, #1d1820 100%);
    }

    .photo-placeholder span {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .photo-placeholder p {
      font-size: 0.9rem;
      background: rgba(0,0,0,0.3);
      padding: 6px 14px;
      border-radius: 30px;
    }

    @media (max-height: 700px) {
      .big-photo-frame { max-height: 200px; }
      .phone-frame { padding: 16px 14px 20px; }
      .ctrl-btn { width: 48px; height: 48px; font-size: 1.3rem; }
      .ctrl-btn.play-btn { width: 58px; height: 58px; font-size: 1.7rem; }
    }

    @media (min-width: 768px) {
      .phone-frame { padding: 30px 24px 36px; border-radius: 42px; }
      .big-photo-frame { max-height: 500px; }
    }
  </style>
</head>
<body>

  <div id="welcomeScreen">
    <div class="welcome-content">
      <span class="welcome-heart">💜</span>
      <div class="welcome-title">Привет</div>
      <div class="welcome-sub">это для тебя</div>
      <button class="welcome-btn" id="welcomeBtn">
        <span class="btn-text">
          <span class="sparkle">✨</span>
          Открыть
          <span class="sparkle">✨</span>
        </span>
      </button>
    </div>
  </div>

  <div id="mainContent">
    <div class="phone-frame">

      <div class="big-photo-frame" id="photoFrame">
        
        <img id="photoImage" src="" alt="Наше фото">
        
        <video id="photoVideo" autoplay loop muted playsinline style="display: none;"></video>
      </div>
      <div class="photo-caption">с днём рождения любимая🎉</div>

      <div class="days-together" id="daysTogether"></div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">Название трека</div>
        <div class="track-artist" id="trackArtist">Исполнитель</div>
      </div>

      <div class="track-counter" id="trackCounter">1 / 2</div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>

      <div class="volume-control">
        <button class="volume-btn" id="volumeDown" aria-label="Тише">🔉</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        <button class="volume-btn" id="volumeUp" aria-label="Громче">🔊</button>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Предыдущий">⏮️</button>
        <button class="ctrl-btn play-btn" id="playBtn" aria-label="Играть">▶️</button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Следующий">⏭️</button>
      </div>

      <button class="secret-btn" id="secretBtn" title="Нажми меня">💌</button>

      <div class="love-note"> © 2026 Powered by Keneshnik.</div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <span class="modal-heart">💜</span>
      <p class="modal-text" id="modalText">Ты — самое лучшее, что случилось со мной.</p>
      <button class="modal-close" id="modalClose">Закрыть</button>
    </div>
  </div>

  <audio id="audioPlayer"></audio>
  <audio id="welcomeSound" src="music/f7ae3585a7db496.mp3" preload="auto"></audio>

  <!-- внешний JS -->
  <script src="script.js"></script>
</body>
</html>
